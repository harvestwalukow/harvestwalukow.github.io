<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harvest Walukow - Graphic Design Portfolio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='white'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        height: 100vh;
        background: #0000ff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Tube light at the top */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 80%;
        height: 150px;
        background-image: url("../asset/tubelight.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center top;
        transform: translateX(-50%);
        z-index: 1;
      }

      .container {
        text-align: center;
        color: white;
        max-width: 600px;
        padding: 40px;
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }

      .content-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      .text-image {
        max-width: 100%;
        height: auto;
        display: block;
        filter: brightness(1.1);
      }

      .open-button {
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
        max-width: 200px;
        height: auto;
      }

      .open-button:hover {
        transform: scale(1.05);
        opacity: 0.9;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        position: relative;
        background: white;
        border-radius: 8px;
        padding: 20px;
        max-width: 90%;
        max-height: 90%;
        overflow: hidden;
      }

      .modal iframe {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 4px;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .container {
          padding: 20px;
          max-width: 90%;
          gap: 20px;
        }

        .content-group {
          gap: 20px;
        }

        .text-image {
          max-width: 90%;
        }

        .open-button {
          max-width: 150px;
        }

        .modal-content {
          padding: 15px;
        }

        .modal iframe {
          width: 100%;
          height: 300px;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 15px;
          max-width: 95%;
          gap: 15px;
        }

        .content-group {
          gap: 15px;
        }

        .text-image {
          max-width: 85%;
        }

        .open-button {
          max-width: 120px;
        }

        .modal iframe {
          width: 100%;
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-group">
        <img
          src="../asset/text.png"
          alt="Harvest Walukow Graphic Design Portfolio"
          class="text-image"
        />
        <img
          src="../asset/open-button.png"
          alt="Open Portfolio"
          class="open-button"
          onclick="openModal()"
        />
      </div>
    </div>

    <!-- Modal -->
    <div id="portfolioModal" class="modal" onclick="closeModal(event)">
      <div class="modal-content">
        <iframe
          style="border: 1px solid rgba(0, 0, 0, 0.1)"
          width="800"
          height="450"
          src="https://embed.figma.com/proto/DbsZa4L2rH02Y2Zcdur7lI/Graphic-Design-Portfolio?node-id=2-2&p=f&scaling=contain&content-scaling=fixed&page-id=0%3A1&embed-host=share"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>

    <script>
      function openModal() {
        document.getElementById("portfolioModal").classList.add("show");
        document.body.style.overflow = "hidden";
      }

      function closeModal(event) {
        // Only close if clicking the backdrop
        if (
          !event ||
          event.target === document.getElementById("portfolioModal")
        ) {
          document.getElementById("portfolioModal").classList.remove("show");
          document.body.style.overflow = "auto";
        }
      }

      // Close modal with Escape key
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeModal();
        }
      });
    </script>
  </body>
</html>
