<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - HARVEST WALUKOW</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='white'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #e7e7e7;
        --muted: rgba(231, 231, 231, 0.6);
        --line: rgba(231, 231, 231, 0.12);
        --accent: rgba(231, 231, 231, 0.9);
        --space: 72px;
      }

      html {
        scroll-behavior: smooth;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }

      a {
        color: var(--fg);
        text-decoration: none;
      }
      a:hover {
        color: var(--accent);
      }

      .container {
        max-width: 420px;
        margin: 0 auto;
        padding: 32px 20px 24px;
      }
      .center {
        text-align: center;
      }
      .spacer {
        height: var(--space);
      }
      .muted {
        color: var(--muted);
      }

      .mono {
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* Blog post styles */
      .post {
        margin-bottom: 48px;
      }

      .post-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
        line-height: 1.3;
      }

      .post-meta {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 16px;
      }

      .post-content {
        font-size: 15px;
        line-height: 1.7;
      }

      .post-content h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 32px 0 16px;
        color: var(--fg);
      }

      .post-content h3 {
        font-size: 16px;
        font-weight: 600;
        margin: 24px 0 12px;
        color: var(--fg);
      }

      .post-content p {
        margin-bottom: 16px;
      }

      .post-content ul {
        margin: 16px 0;
        padding-left: 20px;
      }

      .post-content li {
        margin-bottom: 8px;
      }

      .post-content strong {
        font-weight: 600;
        color: var(--accent);
      }

      .post-content em {
        font-style: italic;
        color: var(--muted);
      }

      .post-content hr {
        border: none;
        height: 1px;
        background: var(--line);
        margin: 32px 0;
      }

      .post-content .tags {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
      }

      /* Mobile */
      @media (max-width: 640px) {
        .container {
          padding: 20px 20px 16px;
          max-width: 300px;
          margin: 0 auto;
        }
        body {
          font-size: 13px;
        }
        .post {
          margin-bottom: 36px;
        }
        .post-title {
          font-size: 20px;
          margin-bottom: 12px;
        }
        .post-content {
          font-size: 14px;
          line-height: 1.6;
        }
        .post-content h2 {
          font-size: 16px;
          margin: 24px 0 12px;
        }
        .post-content h3 {
          font-size: 15px;
          margin: 20px 0 10px;
        }
        .post-content p {
          margin-bottom: 12px;
        }
        .post-content ul {
          margin: 12px 0;
          padding-left: 16px;
        }
        .post-content li {
          margin-bottom: 6px;
        }
        .spacer {
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div id="blog-content">
        <!-- Blog content will be loaded here -->
      </div>
    </main>

    <script>
      // Configure marked.js options
      marked.setOptions({
        breaks: true,
        gfm: true,
      });

      // Function to render markdown content
      function renderMarkdown(markdown) {
        return marked.parse(markdown);
      }

      // Function to load and display blog posts
      async function loadBlogPosts() {
        const blogContent = document.getElementById("blog-content");

        try {
          // Load the markdown file
          const response = await fetch(
            "mengapa-kampus-perlu-mengadopsi-platform-review.md"
          );
          if (!response.ok) {
            throw new Error("Failed to load markdown file");
          }

          const markdown = await response.text();

          // Extract title from first line (assuming it starts with #)
          const lines = markdown.split("\n");
          let title = "";
          let content = markdown;

          if (lines[0].startsWith("# ")) {
            title = lines[0].substring(2);
            content = lines.slice(1).join("\n");
          }

          // Render the markdown content
          const htmlContent = renderMarkdown(content);

          // Create the blog post structure
          const postHTML = `
            <article class="post">
              ${title ? `<h1 class="post-title">${title}</h1>` : ""}
              <div class="post-meta">August 2025 -  Harvest Walukow</div>
              <div class="post-content">${htmlContent}</div>
            </article>
          `;

          blogContent.innerHTML = postHTML;
        } catch (error) {
          console.error("Error loading blog post:", error);
          blogContent.innerHTML = "<p>Error loading blog content.</p>";
        }
      }

      // Load blog posts when page loads
      document.addEventListener("DOMContentLoaded", loadBlogPosts);
    </script>
  </body>
</html>
